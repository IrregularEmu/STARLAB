<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 865" role="img"><title>Uçuş simülasyonu ve boattail giriş akışı</title><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#14374a}.t{font-size:16px;font-weight:650}.d{font-size:13px}</style><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#527e84"/></marker></defs><rect width="1100" height="865" fill="#f3f7f8"/><text x="38" y="49" font-size="30" font-weight="bold">Roket uçuş simülasyonu</text><text x="40" y="78" class="d">C++ · v0.7   /   Her zaman adımında kuvvet, moment ve durum geri beslemesi</text><text x="40" y="122" class="t">ANA ÇÖZÜM DÖNGÜSÜ</text><text x="574" y="122" class="t">04 İÇİNDE   /   BOATTAIL AYRINTISI</text><rect x="40" y="144" width="454" height="60" rx="9" fill="#fff" stroke="#b4c9cd"/><text x="54" y="169" class="t">01   Tasarımı ve aktif kademeyi oku</text><text x="54" y="190" class="d">Motor, CG, atalet, geometri ve başlangıç durumu</text><path d="M267 204v22" fill="none" stroke="#527e84" stroke-width="2" marker-end="url(#arr)"/><rect x="40" y="228" width="454" height="60" rx="9" fill="#fff" stroke="#b4c9cd"/><text x="54" y="253" class="t">02   Atmosfer ve bağıl akış</text><text x="54" y="274" class="d">ρ, a, rüzgâr → V, Mach, α, β ve dinamik basınç</text><path d="M267 288v22" fill="none" stroke="#527e84" stroke-width="2" marker-end="url(#arr)"/><rect x="40" y="312" width="454" height="60" rx="9" fill="#fff" stroke="#b4c9cd"/><text x="54" y="337" class="t">03   Mach rejimini seç</text><text x="54" y="358" class="d">≤ 0,8 subsonik  /  0,8–1,3 geçiş  /  ≥ 1,3 süpersonik</text><path d="M267 372v22" fill="none" stroke="#527e84" stroke-width="2" marker-end="url(#arr)"/><rect x="40" y="396" width="454" height="60" rx="9" fill="#d1eee4" stroke="#b4c9cd"/><text x="54" y="421" class="t">04   Her bileşenin yükünü hesapla</text><text x="54" y="442" class="d">Burun, gövde, kanatçık, transition ve boattail</text><path d="M267 456v22" fill="none" stroke="#527e84" stroke-width="2" marker-end="url(#arr)"/><rect x="40" y="480" width="454" height="60" rx="9" fill="#fff" stroke="#b4c9cd"/><text x="54" y="505" class="t">05   Bileşke kuvvet ve moment</text><text x="54" y="526" class="d">ΣFₐ + itki + ağırlık; momentleri CG etrafında topla</text><path d="M267 540v22" fill="none" stroke="#527e84" stroke-width="2" marker-end="url(#arr)"/><rect x="40" y="564" width="454" height="60" rx="9" fill="#fff" stroke="#b4c9cd"/><text x="54" y="589" class="t">06   DoF türevini hesapla</text><text x="54" y="610" class="d">3DOF: öteleme + yunuslama  /  6DOF: tam rijit gövde</text><path d="M267 624v22" fill="none" stroke="#527e84" stroke-width="2" marker-end="url(#arr)"/><rect x="40" y="648" width="454" height="60" rx="9" fill="#fff" stroke="#b4c9cd"/><text x="54" y="673" class="t">07   Dengeyi ve zaman adımını denetle</text><text x="54" y="694" class="d">Her RK4 ara hesabında 02–06; tam ve yarım adımı karşılaştır</text><path d="M267 708v22" fill="none" stroke="#527e84" stroke-width="2" marker-end="url(#arr)"/><rect x="40" y="732" width="454" height="60" rx="9" fill="#fff" stroke="#b4c9cd"/><text x="54" y="757" class="t">08   Kaydet ve olayı işle</text><text x="54" y="778" class="d">Motor/kademe sınırında adımı böl; süre sonunda bitir</text><rect x="574" y="144" width="490" height="60" rx="9" fill="#fff" stroke="#b4c9cd"/><text x="588" y="169" class="t">Boattail girişini bul</text><text x="588" y="190" class="d">Eşleşme: önceki dış parçanın bitiş istasyonu ve yarıçapı</text><path d="M818 204v22" fill="none" stroke="#527e84" stroke-width="2" marker-end="url(#arr)"/><rect x="574" y="228" width="490" height="60" rx="9" fill="#fff" stroke="#b4c9cd"/><text x="588" y="253" class="t">İmzalı dönüş açısını çıkar</text><text x="588" y="274" class="d">δ = önceki çıkış eğimi − boattail eğimi; eşleşme yoksa ilk eğim 0</text><path d="M818 288v22" fill="none" stroke="#527e84" stroke-width="2" marker-end="url(#arr)"/><rect x="574" y="312" width="490" height="60" rx="9" fill="#fff" stroke="#b4c9cd"/><text x="588" y="337" class="t">Rejime göre hesapla</text><text x="588" y="358" class="d">Subsonik: ampirik kayıp; geçiş: harman; süpersonik: genişleme</text><path d="M818 372v22" fill="none" stroke="#527e84" stroke-width="2" marker-end="url(#arr)"/><rect x="574" y="396" width="490" height="60" rx="9" fill="#fff" stroke="#b4c9cd"/><text x="588" y="421" class="t">Yerel Mach ve statik basınç var mı?</text><text x="588" y="442" class="d">M > 1,2 için sağlayıcının bu parçaya ait verisini sorgula</text><rect x="574" y="480" width="490" height="60" rx="9" fill="#fff" stroke="#b4c9cd"/><text x="588" y="505" class="t">Var → yerel giriş</text><text x="588" y="526" class="d">M₁, p₁ ve δ → duvar basıncı; basınç farkını uçuş Q’suna böl</text><rect x="574" y="564" width="490" height="60" rx="9" fill="#ffe9cb" stroke="#b4c9cd"/><text x="588" y="589" class="t">Yok → yaklaşık giriş</text><text x="588" y="610" class="d">Serbest akım Mach ve basıncını kullan; proxy etiketi yaz</text><path d="M818 624v22" fill="none" stroke="#527e84" stroke-width="2" marker-end="url(#arr)"/><rect x="574" y="648" width="490" height="60" rx="9" fill="#fff" stroke="#b4c9cd"/><text x="588" y="673" class="t">Sonucu yüzey toplamına aktar</text><text x="588" y="694" class="d">Eğimli yüzey sürüklemesi ayrı, açık arka disk sürüklemesi ayrı</text><path d="M494 426H540V174H572" fill="none" stroke="#527e84" stroke-width="2" marker-end="url(#arr)"/><path d="M818 456v22" fill="none" stroke="#527e84" stroke-width="2" marker-end="url(#arr)"/><path d="M1064 426h15v168h-13" fill="none" stroke="#527e84" stroke-width="2" marker-end="url(#arr)"/><path d="M574 510h-14v168h12" fill="none" stroke="#527e84" stroke-width="2" marker-end="url(#arr)"/><path d="M40 762H18V258h20" fill="none" stroke="#527e84" stroke-width="2" marker-end="url(#arr)"/><text x="42" y="834" class="d">Denge hatası → dur. Adım farkı yüksek → böl ve yeniden hesapla. Kademe değişirse CG’yi aktar, yeni parçaları seç.</text></svg>
